# Insert inside the HTTPS server block for chorifyai.sligenai.cn,
# before the existing location / block.
location = /hook-studio {
    return 308 /hook-studio/;
}

location ^~ /hook-studio/ {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:8011/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /hook-studio;
    # SSE task events must reach the browser immediately and survive long jobs.
    proxy_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no always;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
}
